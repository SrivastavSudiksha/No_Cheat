spring:
  application:
    name: nocheat-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nocheat}
    username: ${SPRING_DATASOURCE_USERNAME:nocheat}
    password: ${SPRING_DATASOURCE_PASSWORD:nocheat_secret}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

nocheat:
  jwt:
    secret: ${JWT_SECRET:super-long-random-secret-change-in-prod-32chars+}
    expiration-ms: 10800000   # 3 hours
  detection-service-url: ${DETECTION_SERVICE_URL:http://localhost:8000}
  evidence:
    retention-days: 30
