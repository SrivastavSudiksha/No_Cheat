version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nocheat
      POSTGRES_USER: nocheat
      POSTGRES_PASSWORD: nocheat_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocheat"]
      interval: 5s
      timeout: 5s
      retries: 5

  detection:
    build: ./detection_service
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: "super-long-random-secret-change-in-prod-32chars+"
      EVIDENCE_DIR: /app/evidence
    volumes:
      - evidence_data:/app/evidence
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nocheat
      SPRING_DATASOURCE_USERNAME: nocheat
      SPRING_DATASOURCE_PASSWORD: nocheat_secret
      JWT_SECRET: "super-long-random-secret-change-in-prod-32chars+"
      DETECTION_SERVICE_URL: http://detection:8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Uncomment when frontends are ready
  # client:
  #   build: ./client
  #   ports:
  #     - "3000:3000"
  # admin:
  #   build: ./admin
  #   ports:
  #     - "3001:3000"

volumes:
  pgdata:
  evidence_data:
